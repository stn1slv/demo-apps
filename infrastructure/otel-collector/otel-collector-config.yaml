receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        include_metadata: true
        cors:
          allowed_origins:
            - "*"

exporters:
  prometheus:
    endpoint: "0.0.0.0:8889"
    # const_labels:
    #   label1: value1

  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true    # Add this to disable TLS

processors:
  # memory_limiter must be first in every pipeline: it refuses data before
  # the collector runs out of memory under load (e.g. JMeter runs).
  memory_limiter:
    check_interval: 1s
    limit_mib: 400
    spike_limit_mib: 100
  batch:

extensions:
  health_check:
  pprof:
    endpoint: :1888
  zpages:
    endpoint: :55679

service:
  extensions: [pprof, zpages, health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/jaeger]
    metrics:
      # receivers: [otlp, prometheus]
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]