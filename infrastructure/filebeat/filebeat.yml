setup.template.name: "filebeat"
setup.template.pattern: "filebeat"
setup.ilm.enabled: false

filebeat.inputs:
- type: container
  paths: 
    - '/var/lib/docker/containers/*/*.log'

  multiline.type: pattern
  multiline.pattern: '^[[:space:]]'
  multiline.negate: false
  multiline.match: after

logging.level: warning

processors:
- add_docker_metadata:
    host: "unix:///var/run/docker.sock"
# Field names must stay in sync with the logback.xml pattern, the Grafana
# Logs dashboard and the Jaeger datasource tracesToLogsV2 query
# (msg.trace_id / msg.span_id).
- dissect:
    tokenizer: "%{time} %{severity} [%{trace_id},%{span_id}] %{class} - %{message}"
    field: "message"
    target_prefix: "msg"
    ignore_failure: true
# - drop_event:
#     when:
#       not:
#         equals:
#           container.name: "trip-booking-app"

#FOR DEBUG  
# output.console:
#   pretty: true
  
output.elasticsearch:
  hosts: ["http://elasticsearch:9200"]
  username: "elastic"
  password: "elastic"
  # index: "filebeat-%{+yyyy.MM.dd}"
  index: "filebeat-%{+yyyy.MM.dd}"